[package]
name = "sayan-warehouse"
version = "1.0.0"
description = "Sayan warehouse system desktop application with embedded server and client-server dual role support"
authors = ["Sayan AI Core Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.65"

[build-dependencies]
tauri-build = { version = "1.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.4", features = ["api-all", "updater"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "blocking"] }

# Embedded Server & Dual-Role Networking Dependencies
axum = { version = "0.6", features = ["ws", "json"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.4", features = ["cors", "fs", "trace"] }
hyper = { version = "0.14", features = ["full"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
